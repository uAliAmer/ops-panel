<!doctype html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<script>
			// Apply the theme before stylesheets to avoid FOUC. Nothing is stored
			// until the operator picks one, and an unset theme follows the device —
			// the same default the store uses, repeated here because this runs long
			// before it loads.
			(function () {
				try {
					var t = localStorage.getItem('theme');
					var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					var effective = t === 'light' || t === 'dark' ? t : sys;
					document.documentElement.classList.toggle('dark', effective === 'dark');
					// The browser paints its own chrome from this before the app runs.
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.content = effective === 'dark' ? '#0f172a' : '#ffffff';
				} catch (e) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#0f172a" />
		<meta name="description" content="إدارة ومراجعة طلبات الشحن — OPS" />

		<script>
			// Capture the install prompt as early as possible — Chrome may fire
			// beforeinstallprompt before the app hydrates. InstallPrompt.svelte reads
			// window.__deferredInstallPrompt and listens for the custom relay event.
			window.addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__deferredInstallPrompt = e;
				window.dispatchEvent(new Event('pwa-installable'));
			});
		</script>

		<!-- PWA -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="OPS" />
		<meta name="application-name" content="OPS" />

		<!-- Icons -->
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico?v=3" />
		<link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/icons/favicon-48.png?v=3" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/favicon-32.png?v=3" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png?v=3" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Archivo Black is one word on one screen: DROPSHIPPING in the order
		     header. Tajawal stops at 800 and its Latin is a text face, so it
		     cannot carry a display line — set big it just looks like bold body
		     copy. One weight, one file, and it only ever renders on dropship
		     orders; swap: false so a slow font never blanks the header. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Archivo+Black&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-background text-foreground">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
