server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed assets are immutable; everything else must revalidate so a deploy
    # is picked up on the next navigation.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A client-routed app: any unknown path is a route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Point these at your backend if you serve the API from the same host.
    # location /api/       { proxy_pass http://backend:3005; }
    # location /socket.io/ { proxy_pass http://backend:3005; proxy_http_version 1.1; }
}
